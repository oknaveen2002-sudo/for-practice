name: Java CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B compile

      - name: Run tests
        run: mvn -B test

      - name: Package (skip tests, already run)
        run: mvn -B package -DskipTests

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-cd-demo-jar
          path: target/ci-cd-demo.jar

  # Example "deploy" stage - only runs after build-and-test succeeds, and only on main.
  # Replace the "Deploy" step with real deployment commands (e.g. deploy to a server,
  # push a Docker image, or publish to a package registry).
  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-cd-demo-jar

      - name: "Deploy (placeholder)"
        run: |
          echo "Pretend to deploy ci-cd-demo.jar here."
          echo "e.g. scp/rsync to a server, docker build+push, or publish to a registry."
